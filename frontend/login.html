<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - ParkCast</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="login-card">
    <h1>ParkCast</h1>
    <p>Login to continue</p>

    <input id="username" type="text" placeholder="Username" />
    <input id="password" type="password" placeholder="Password" />

    <button onclick="login()">Login</button>
    <p id="loginError" style="color:#ff6b6b;font-size:14px;min-height:20px;"></p>

    <div class="demo-info">
      Demo: peter / 123456
    </div>
  </div>

  <script src="./js/mockUsers.js"></script>
  <script src="./js/dataService.js"></script>
  <script>
    async function login() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const error = document.getElementById("loginError");
      error.textContent = "";

      if (!username || !password) {
        error.textContent = "Please enter username and password.";
        return;
      }

      try {
        const user = await DataService.login(username, password);
        if (!user) {
          error.textContent = "Invalid username or password.";
          return;
        }
        sessionStorage.setItem("currentUser", JSON.stringify(user));
        window.location.href = "index.html";
      } catch {
        error.textContent = "Invalid username or password.";
      }
    }
  </script>
</body>
</html>
